[server]
service_name = "cache-manager"
service_token = ""
global_concurrency = 64
max_inflight_bytes = 1073741824
range_size = 4194304
load_lease = "30s"
hint_timeout = "500ms"
scheduler_interval = "100ms"
enable_phase2 = false
enable_phase3 = false
enable_phase4 = false
phase4_upload_interval = "100ms"
phase4_orphan_cleanup_retention = "24h"
phase4_upload_page_size = 100
phase4_upload_global_concurrency = 4
phase4_upload_per_owner_concurrency = 2
phase4_upload_per_origin_concurrency = 2
phase4_cache_table_id = 2
phase4_cache_block_size = 4194304
phase4_cache_stripe_size = 1
phase4_publish_prefetch_priority = 2147483647
upload_part_size = 16777216
upload_retry_limit = 8
reconcile_page_size = 256
reconcile_max_concurrency = 8
reconcile_interval = "10min"
reconcile_max_mutations = 1000
reconcile_max_run_time = "5min"
reconcile_dry_run = false
reconcile_request_timeout = "30s"
phase3_planner_interval = "100ms"
phase3_runner_interval = "100ms"
phase3_tracker_interval = "1s"
phase3_pin_renew_interval = "1min"
phase3_active_pin_ttl = "5min"
phase3_job_page_size = 100
phase3_plan_page_size = 1000
phase3_prefix_table_id = 0
phase3_prefix_block_size = 4194304
phase3_prefix_stripe_size = 1
admission_policy = "second_miss"
eviction_policy = "lru"
capacity_high_watermark = 0.90
capacity_low_watermark = 0.80
space_poll_interval = "5s"
space_snapshot_max_age = "15s"
eviction_interval = "5s"
eviction_protection_period = "10min"
eviction_page_size = 1000
eviction_batch_size = 256
evicting_scan_interval = "5s"
evicting_page_size = 1000
storage_permit_ttl = "60s"
lease_recovery_interval = "5s"
lease_recovery_page_size = 1000
access_flush_threshold = 256
access_flush_batch_size = 512
access_max_entries = 65536
access_flush_interval = "1s"

[[server.origins]]
origin_id = 1
endpoint = "http://127.0.0.1:9000"
region = "us-east-1"
use_tls = false
path_style = true
max_concurrent_requests = 16
max_inflight_bytes = 268435456

[[server.base.groups]]
network_type = "TCP"
services = ["CacheManagerSerde"]

[server.base.groups.listener]
listen_port = 8000

[[server.base.groups]]
network_type = "TCP"
services = ["Core"]
use_independent_thread_pool = true

[server.base.groups.listener]
listen_port = 9000
