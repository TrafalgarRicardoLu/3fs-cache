[server]
service_name = "cache-manager"
service_token = ""
global_concurrency = 64
max_inflight_bytes = 1073741824
range_size = 4194304
load_lease = "30s"
hint_timeout = "500ms"
scheduler_interval = "100ms"
enable_phase2 = false
admission_policy = "second_miss"
eviction_policy = "lru"
capacity_high_watermark = 0.90
capacity_low_watermark = 0.80
space_poll_interval = "5s"
space_snapshot_max_age = "15s"
eviction_interval = "5s"
eviction_protection_period = "10min"
eviction_page_size = 1000
eviction_batch_size = 256
evicting_scan_interval = "5s"
evicting_page_size = 1000
storage_permit_ttl = "60s"
access_flush_threshold = 256
access_flush_batch_size = 512
access_max_entries = 65536
access_flush_interval = "1s"

[[server.origins]]
origin_id = 1
endpoint = "http://127.0.0.1:9000"
region = "us-east-1"
use_tls = false
path_style = true
max_concurrent_requests = 16
max_inflight_bytes = 268435456

[[server.base.groups]]
network_type = "TCP"
services = ["CacheManagerSerde"]

[server.base.groups.listener]
listen_port = 8000

[[server.base.groups]]
network_type = "TCP"
services = ["Core"]
use_independent_thread_pool = true

[server.base.groups.listener]
listen_port = 9000
